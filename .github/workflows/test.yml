name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: stdlib unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # NO '|| true' here: install failures must fail the job. The previous
      # '|| true' masked the missing jev_quilt/polyformalism.py — the unittest
      # step passed while the canary import was broken (fixed in PR #21 / #20).
      - name: install (no deps)
        run: |
          python -m pip install --upgrade pip
          # No third-party deps; stdlib only (no requests, no numpy, no pytest)
          pip install -e . --no-deps

      - name: test (stdlib unittest, no pytest)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -t .
          echo "---"
          echo "✅ jev-quilt production tests passed (stdlib unittest, no pytest)"

      # Depends on jev_quilt/polyformalism.py (lands with PR #21 / #20).
      # NOTE: the previous version of this step interpolated an undefined
      # 'python_version' name in the f-string — a NameError AFTER the assert,
      # i.e. the step could never go green. Fixed.
      - name: canary check
        run: |
          python -c "
          from jev_quilt.polyformalism import fleet_canary
          c = fleet_canary()
          assert c == '0x024a555471370b18d', f'canary mismatch: {c}'
          print(f'✓ fleet canary {c} verified')
          "


  build:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
          echo "✅ jev-quilt $(python -c 'from jev_quilt import __version__; print(__version__)') built"
